name: Blee Production Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          sdkmanager --version || true

      - name: Repository sanity
        run: bash scripts/repo-sanity.sh

      - name: Build and verify Blee 2.7
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: bash build-blee.command

      - name: Verify final artifact
        run: |
          test -f dist/Blee-2.7.0.apk
          bash scripts/verify-apk-integrity.sh dist/Blee-2.7.0.apk
          sha256sum dist/Blee-2.7.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blee-2.7.0
          path: |
            dist/Blee-2.7.0.apk
            dist/Blee-2.7.0.apk.sha256
          if-no-files-found: error
