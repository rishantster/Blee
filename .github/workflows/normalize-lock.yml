name: Normalize package lock

on:
  push:
    branches:
      - cleanup/source-first-v1

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/source-first-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "Blee CI"
          git config user.email "75270803+rishantster@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Align package lock with Blee 2.7.0"
          git push origin HEAD:cleanup/source-first-v1
