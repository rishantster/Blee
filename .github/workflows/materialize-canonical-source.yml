name: Materialize Canonical Blee Source

on:
  push:
    branches:
      - recovery/canonical-source-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/canonical-source-v1
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Materialize current production tree
        id: build
        shell: bash
        run: |
          set +e
          bash build-blee.command
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Canonical builder exit status: $status"
          exit 0

      - name: Validate materialized source exists
        shell: bash
        run: |
          test -f package.json
          test -f src/components/BleeApp.tsx
          test -f src/components/BleeRuntime.tsx
          test -f src/hooks/useBlee.ts
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -n "$(find android/app/src/main/java -name 'BleeMeshService.java' -print -quit)"
          test -n "$(find android/app/src/main/java -name 'BleeMeshDb.java' -print -quit)"

      - name: Remove generated build output only
        shell: bash
        run: |
          rm -rf node_modules .next out
          rm -rf android/.gradle android/build android/app/build
          rm -f android/local.properties
          find . -name '.DS_Store' -delete
          cat > CANONICAL_SOURCE_SNAPSHOT.md <<EOF
          # Canonical Blee source snapshot

          This branch contains the materialized Blee application source and Android source tree produced from the legacy archive/patch pipeline so the project can be repaired into a normal source-first repository.

          Legacy builder exit status during materialization: ${{ steps.build.outputs.status }}
          Materialized from commit: ${{ github.sha }}
          EOF

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "Blee Source Recovery"
          git config user.email "75270803+rishantster@users.noreply.github.com"

          for path in \
            package.json package-lock.json \
            next.config.ts next.config.js tsconfig.json postcss.config.mjs \
            capacitor.config.ts capacitor.config.json \
            app src public plugins android CANONICAL_SOURCE_SNAPSHOT.md; do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No materialized source changes to commit."
            exit 0
          fi

          git commit -m "Materialize canonical Blee application source"
          git push origin HEAD:recovery/canonical-source-v1
