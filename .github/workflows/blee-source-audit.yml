name: Blee generated source audit

on:
  push:
    branches: [blee-professional]
    paths-ignore:
      - 'audit/generated/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blee-professional
          fetch-depth: 0
      - name: Unpack professional source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat professional/parts/part* > /tmp/prof.b64
          base64 -d /tmp/prof.b64 > /tmp/prof.tar.gz
          rm -rf /tmp/prof-src
          mkdir -p /tmp/prof-src
          tar -xzf /tmp/prof.tar.gz -C /tmp/prof-src
          find /tmp/prof-src -maxdepth 3 -type f -print
      - name: Export inspectable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit/generated
          mkdir -p audit/generated
          cp /tmp/prof-src/src/components/BleeApp.tsx audit/generated/BleeApp.tsx
          cp /tmp/prof-src/src/hooks/useBlee.ts audit/generated/useBlee.ts
          cp /tmp/prof-src/app/globals.css audit/generated/globals.css
          git config user.name 'blee-audit-bot'
          git config user.email '75270803+rishantster@users.noreply.github.com'
          git add audit/generated
          if git diff --cached --quiet; then
            echo 'Generated audit snapshot unchanged.'
            exit 0
          fi
          git commit -m 'Export professional source snapshot [audit-output]'
          git push origin HEAD:blee-professional
