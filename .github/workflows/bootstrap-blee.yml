name: Bootstrap and Build Blee Android

on:
  push:
    branches: [blee-v1-sqlite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Blee source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/part* > /tmp/blee-source.b64
          test "$(wc -c < /tmp/blee-source.b64)" -eq 42120
          base64 -d /tmp/blee-source.b64 > /tmp/blee-source.tar.gz
          echo "c28e106c9bbfb1687e061c33ec3bc3fb0ad9623fc8c320876611f390ddfc104d  /tmp/blee-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/blee-source.tar.gz -C .
          test -f package.json
          test -f src/hooks/useBlee.ts
          test -f plugins/blee-store/android/src/main/java/com/blee/store/BleeStorePlugin.java
          grep -q 'SQLiteOpenHelper' plugins/blee-store/android/src/main/java/com/blee/store/BleeStorePlugin.java
          grep -q 'durablyReceivedAt' src/hooks/useBlee.ts
          grep -q 'replacePayments' src/lib/persistence.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Preserve Blee test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blee-android-debug-keystore-v1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build app bundle
        run: npm run build

      - name: Generate Android project
        run: npm run android:prepare

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          keytool -printcert -jarfile "$APK" | sed -n '1,24p'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blee-1.0-sqlite-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Promote reconstructed source onto build branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-blee.yml
          rm -rf android .next out node_modules
          git config user.name "Blee Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build Blee Android with durable SQLite offline payments"
            git push origin HEAD:blee-v1-sqlite
          fi
