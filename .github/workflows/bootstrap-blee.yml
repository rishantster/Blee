name: Bootstrap and Build Blee Android

on:
  push:
    branches: [blee-v1-sqlite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Reconstruct Blee source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/part* > /tmp/blee-source.b64
          test "$(wc -c < /tmp/blee-source.b64)" -eq 42120
          base64 -d /tmp/blee-source.b64 > /tmp/blee-source.tar.gz
          echo "c28e106c9bbfb1687e061c33ec3bc3fb0ad9623fc8c320876611f390ddfc104d  /tmp/blee-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/blee-source.tar.gz -C .
          test -f package.json
          test -f src/hooks/useBlee.ts
          test -f plugins/blee-store/android/src/main/java/com/blee/store/BleeStorePlugin.java
          grep -q 'SQLiteOpenHelper' plugins/blee-store/android/src/main/java/com/blee/store/BleeStorePlugin.java
          grep -q 'durablyReceivedAt' src/hooks/useBlee.ts
          grep -q 'replacePayments' src/lib/persistence.ts

      - name: Select Node 22 and Java 21
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm install 22
            nvm use 22
            echo "$HOME/.nvm/versions/node/$(node -v)/bin" >> "$GITHUB_PATH"
          fi
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          fi
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build app bundle
        run: npm run build

      - name: Generate Android project
        run: npm run android:prepare

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify and publish APK to build branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee /tmp/blee-apk.sha256
          keytool -printcert -jarfile "$APK" | sed -n '1,24p'
          mkdir -p dist
          cp "$APK" dist/Blee-1.0-sqlite-offline-debug.apk
          cp /tmp/blee-apk.sha256 dist/Blee-1.0-sqlite-offline-debug.sha256
          git config user.name "Blee Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/Blee-1.0-sqlite-offline-debug.apk dist/Blee-1.0-sqlite-offline-debug.sha256
          git commit -m "Publish Blee 1.0 SQLite offline APK [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:blee-v1-sqlite
