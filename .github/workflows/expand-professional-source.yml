name: Expand Blee professional source

on:
  push:
    branches:
      - blee-professional

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f package.json ] && [ -f src/components/BleeApp.tsx ]; then
            echo "Blee source is already expanded"
            exit 0
          fi
          ls -la
          ls -la bootstrap/parts
          cat bootstrap/parts/part* > /tmp/blee-source.b64
          test "$(wc -c < /tmp/blee-source.b64)" -eq 42120
          base64 -d /tmp/blee-source.b64 > /tmp/blee-source.tar.gz
          echo "c28e106c9bbfb1687e061c33ec3bc3fb0ad9623fc8c320876611f390ddfc104d  /tmp/blee-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/blee-source.tar.gz -C .
          test -f package.json
          test -f src/components/BleeApp.tsx
          test -f src/hooks/useBlee.ts
          test -f src/lib/persistence.ts

      - name: Commit expanded source
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f package.json ]; then
            exit 0
          fi
          git config user.name "Blee Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source expansion changes"
            exit 0
          fi
          git commit -m "Expand Blee source for professional rebuild [expanded-source]"
          git push origin HEAD:blee-professional
