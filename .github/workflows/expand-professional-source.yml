name: Expand Blee professional source

on:
  push:
    branches:
      - blee-professional

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and persist diagnostics
        shell: bash
        run: |
          set +e
          LOG=professional-bootstrap-diagnostics.txt
          : > "$LOG"
          run() {
            echo ">>> $*" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            code=$?
            echo "exit=$code" | tee -a "$LOG"
            return $code
          }

          if [ -f package.json ] && [ -f src/components/BleeApp.tsx ]; then
            echo "Source already expanded" | tee -a "$LOG"
          else
            run ls -la
            run ls -la bootstrap/parts
            cat bootstrap/parts/part* > /tmp/blee-source.b64 2>>"$LOG"
            echo "b64_bytes=$(wc -c < /tmp/blee-source.b64 2>/dev/null)" >>"$LOG"
            base64 -d /tmp/blee-source.b64 > /tmp/blee-source.tar.gz 2>>"$LOG"
            echo "decode_exit=$?" >>"$LOG"
            sha256sum /tmp/blee-source.tar.gz >>"$LOG" 2>&1
            tar -tzf /tmp/blee-source.tar.gz | head -80 >>"$LOG" 2>&1
            echo "list_exit=$?" >>"$LOG"
            tar -xzf /tmp/blee-source.tar.gz -C . >>"$LOG" 2>&1
            echo "extract_exit=$?" >>"$LOG"
            for f in package.json src/components/BleeApp.tsx src/hooks/useBlee.ts src/lib/persistence.ts; do
              if [ -f "$f" ]; then echo "FOUND $f" >>"$LOG"; else echo "MISSING $f" >>"$LOG"; fi
            done
          fi

          git config user.name "Blee Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand Blee source with diagnostics [expanded-source]"
            git push origin HEAD:blee-professional
          fi
          exit 0
