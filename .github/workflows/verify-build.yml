name: Verify Blee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # package.json/package-lock.json are intentionally materialized from
          # the verified bootstrap archive by build-blee.command. Enabling the
          # setup-node npm cache here makes the job fail before the builder can
          # create those files.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle files are also materialized during the canonical build, so
          # setup-java cannot discover them at this point in the job.

      - uses: android-actions/setup-android@v3

      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Repository sanity
        run: bash scripts/repo-sanity.sh

      - name: Verify repository contract
        run: python3 scripts/verify-canonical-build.py

      - name: Build canonical APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: bash build-blee.command

      - name: Verify artifact contract
        run: |
          test -f dist/Blee-2.6.0.apk
          unzip -t dist/Blee-2.6.0.apk >/dev/null
          test -f dist/Blee-2.6.0.apk.sha256
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Upload Blee 2.6.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Blee
          path: |
            dist/Blee-2.6.0.apk
            dist/Blee-2.6.0.apk.sha256
          if-no-files-found: error
