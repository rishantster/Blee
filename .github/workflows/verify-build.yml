name: Verify Blee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build utilities
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Toolchain preflight
        run: |
          node --version
          npm --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          sdkmanager --version

      - name: Repository sanity
        run: bash scripts/repo-sanity.sh

      - name: Verify repository contract
        run: python3 scripts/verify-canonical-build.py

      - name: Build canonical APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: bash build-blee.command

      - name: Verify artifact contract
        run: |
          test -f dist/Blee-2.7.0.apk
          unzip -t dist/Blee-2.7.0.apk >/dev/null
          test -f dist/Blee-2.7.0.apk.sha256
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          bash scripts/verify-apk-integrity.sh dist/Blee-2.7.0.apk
          sha256sum dist/Blee-2.7.0.apk

      - name: Upload Blee 2.7.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Blee-2.7.0
          path: |
            dist/Blee-2.7.0.apk
            dist/Blee-2.7.0.apk.sha256
          if-no-files-found: error
