name: Build Blee 1.3 Android

on:
  push:
    branches: [blee-professional]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build and verify Blee 1.3 APK
        shell: bash
        run: bash build-blee-professional.command

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Blee-1.3.0-professional-debug
          path: |
            dist/Blee-1.3.0-professional-debug.apk
            dist/Blee-1.3.0-professional-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
